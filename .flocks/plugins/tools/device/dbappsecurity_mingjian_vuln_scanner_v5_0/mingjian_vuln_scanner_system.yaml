name: mingjian_vuln_scanner_system
description: Query DBAPPSecurity Mingjian Vulnerability Scanner system version, resource usage, and license information.
description_cn: 查询安恒信息明鉴漏洞扫描系统版本、资源使用和授权信息。
category: security
enabled: true
requires_confirmation: false
provider: dbappsecurity_mingjian_vuln_scanner_api
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - license
        - license_v5
        - version
        - resource_usage
      default: version
      description: license_v5 按厂商手册保留双斜杠路径 /api/normal/system//license/v5。
    params:
      type: object
      description: 透传查询参数。
      additionalProperties: true
  additionalProperties: false
handler:
  type: script
  script_file: mingjian_vuln_scanner.handler.py
  function: system
