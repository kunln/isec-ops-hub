name: mingjian_vuln_scanner_results
description: Query DBAPPSecurity Mingjian Vulnerability Scanner scan results, vulnerability counts, and website information.
description_cn: 查询安恒信息明鉴漏洞扫描系统扫描结果、漏洞数量和站点信息。
category: security
enabled: true
requires_confirmation: false
provider: dbappsecurity_mingjian_vuln_scanner_api
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - scan_result
        - vulnerability_count
        - website_info
        - sync
      default: scan_result
      description: sync 会先按 module 查询任务，再按 taskId 聚合漏洞结果。
    module:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 module 参数。
    modules:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
      description: sync 聚合动作使用的厂商 module 列表，默认 0、1、5、8、11。
    offset:
      type: integer
      default: 0
      minimum: 0
    limit:
      type: integer
      default: 50
      minimum: 1
      maximum: 100
    task_limit:
      type: integer
      default: 10
      minimum: 1
      maximum: 100
      description: sync 聚合动作每个 module 最多读取的任务数量。
    task_id:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 taskId 参数。
    task_ids:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
      description: 厂商 taskIds[] 参数。
    asset_id:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 assetId 参数。
    vul_type:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 vulType 参数。
    start_time:
      type: string
      description: 厂商 startTime 参数。
    end_time:
      type: string
      description: 厂商 endTime 参数。
    params:
      type: object
      description: 透传查询参数，优先级高于标准字段。
      additionalProperties: true
    body:
      type: object
      description: 透传表单参数。
      additionalProperties: true
  additionalProperties: false
handler:
  type: script
  script_file: mingjian_vuln_scanner.handler.py
  function: results
