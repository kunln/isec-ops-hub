name: mingjian_vuln_scanner_tasks
description: Query DBAPPSecurity Mingjian Vulnerability Scanner read-only task lists, counts, status, and progress.
description_cn: 查询安恒信息明鉴漏洞扫描系统任务列表、数量、状态和进度等只读信息。
category: security
enabled: true
requires_confirmation: false
provider: dbappsecurity_mingjian_vuln_scanner_api
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - progress
        - list
        - list_v2
        - count
        - status
      default: list_v2
      description: list 仅查 API 创建任务；list_v2 查 Web 和 API 任务；progress/status/count 为只读状态查询。
    module:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 module 参数。
    offset:
      type: integer
      default: 0
      minimum: 0
    limit:
      type: integer
      default: 50
      minimum: 1
      maximum: 100
    task_id:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 taskId 参数。
    task_ids:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
      description: 厂商 taskIds[] 参数。
    state:
      oneOf:
        - type: string
        - type: integer
      description: 任务状态过滤。
    start_time:
      type: string
      description: 厂商 startTime 参数。
    end_time:
      type: string
      description: 厂商 endTime 参数。
    params:
      type: object
      description: 透传查询参数，优先级高于标准字段。
      additionalProperties: true
    body:
      type: object
      description: POST 只读接口的透传表单参数。
      additionalProperties: true
  additionalProperties: false
handler:
  type: script
  script_file: mingjian_vuln_scanner.handler.py
  function: tasks
