name: mingjian_vuln_scanner_assets
description: Query DBAPPSecurity Mingjian Vulnerability Scanner read-only asset lists and asset counts.
description_cn: 查询安恒信息明鉴漏洞扫描系统资产列表和资产数量等只读信息。
category: security
enabled: true
requires_confirmation: false
provider: dbappsecurity_mingjian_vuln_scanner_api
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - get
        - get_v2
        - count
        - sync
      default: get_v2
      description: get 仅查 API 创建资产；get_v2 查 Web 和 API 资产；count 为资产计数；sync 按支持模块聚合只读资产数据。
    module:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 module 参数。
    modules:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
      description: sync 聚合动作使用的厂商 module 列表，默认 0、1、5、8。
    offset:
      type: integer
      default: 0
      minimum: 0
    limit:
      type: integer
      default: 50
      minimum: 1
      maximum: 100
    asset_id:
      oneOf:
        - type: string
        - type: integer
      description: 厂商 assetId 参数。
    params:
      type: object
      description: 透传查询参数，优先级高于标准字段。
      additionalProperties: true
    body:
      type: object
      description: POST 只读接口的透传表单参数。
      additionalProperties: true
  additionalProperties: false
handler:
  type: script
  script_file: mingjian_vuln_scanner.handler.py
  function: assets
