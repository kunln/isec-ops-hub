name: mingjian_vuln_scanner_engines
description: Query DBAPPSecurity Mingjian Vulnerability Scanner scan-engine information.
description_cn: 查询安恒信息明鉴漏洞扫描系统扫描引擎信息。
category: security
enabled: true
requires_confirmation: false
provider: dbappsecurity_mingjian_vuln_scanner_api
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - engines
        - engines_v5
      default: engines_v5
      description: engines 查询兼容引擎接口；engines_v5 查询 V5 引擎接口。
    params:
      type: object
      description: 透传查询参数。
      additionalProperties: true
  additionalProperties: false
handler:
  type: script
  script_file: mingjian_vuln_scanner.handler.py
  function: engines
