dedupKey: "builtin:security-alert-triage-notify"
title: "Security Alert Triage Notify"
description: >-
  Every 5 minutes, scan newly synced high/critical security alerts, run local
  Flocks triage, deduplicate results, and push a summary through the selected
  IM channel.

executionMode: workflow
workflowID: security_alert_triage_notify
type: scheduled
priority: high

enabled: true
cron: "*/5 * * * *"
timezone: Asia/Shanghai
cronDescription: "Every 5 minutes"

tags:
  - security
  - alert
  - triage
  - notification

context:
  channel_id: weixin
  to: ""
  account_id: ""
  severity_levels:
    - critical
    - high
  statuses:
    - new
  lookback_minutes: 1440
  max_alerts: 10
  scan_limit: 500
  create_incident: true
  dry_run: false
  reset_state: false
  send_when_empty: false
